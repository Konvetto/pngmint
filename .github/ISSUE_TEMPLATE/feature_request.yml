name: Feature request
description: Suggest an option or an API change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What would you add? Why can a preset or existing option not cover it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
