version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint does not support TS 7 yet; tsup 9 needs Node 22.18+ but CI builds on Node 20;
      # @types/node follows the newest Node in the CI matrix (24).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: tsup
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
