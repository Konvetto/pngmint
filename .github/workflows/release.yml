name: Release

# Publishes to npm with provenance when a version tag is pushed (v1.2.3).
# npm trusted publishing (OIDC, no token): pngmint on npmjs.com trusts this repository, this
# workflow file and the `npm` environment. A version already on npm (0.1.0 went out by hand) is
# not published again; the GitHub release is still made.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check that the tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish unless this version is already on npm
        run: |
          if npm view "pngmint@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "Already on npm, skipping publish"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
