<text x="28" y="28" font-size="16" font-weight="500" fill="#0b0b0b">Four palette quantizers at 256 colors, same pixels in, same color count</text>
<text x="28" y="46" fill="#52514e">14 public-domain images, Node 26, Apple Silicon laptop, median of 3 runs. pngmint as installed, default compressor.</text>
<text x="28" y="78" font-weight="500" fill="#0b0b0b">Photos, 5 images (0.4 to 14 MP)</text>
<text x="28" y="104" fill="#0b0b0b" font-weight="500">File size</text>
<text x="28" y="119" fill="#52514e" font-size="11">sum of the group, lower is better</text>
