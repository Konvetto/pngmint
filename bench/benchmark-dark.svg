<text x="32" y="552" fill="#c3c2b7" font-size="11">Graphics PSNR is the mean over the 7 images every library encodes with a loss; 2 are lossless for pngmint.</text>
<text x="32" y="568" fill="#c3c2b7" font-size="11">Below 128 colors UPNG.js writes smaller photo files than pngmint, without dithering.</text>
<text x="32" y="584" fill="#c3c2b7" font-size="11">libimagequant runs as wasm. Full tables: bench/results.md.</text>
</svg>
