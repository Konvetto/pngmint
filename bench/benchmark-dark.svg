<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 548" width="760" height="548" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13">
<title>Four PNG quantizers at 256 colors: file size, PSNR and time</title>
<rect width="760" height="548" rx="12" fill="#1a1a19"/>
<text x="28" y="28" font-size="16" font-weight="500" fill="#f0efec">Four palette quantizers at 256 colors, same pixels in, same color count</text>
<text x="28" y="46" fill="#c3c2b7">14 public-domain images, Node 26, Apple Silicon laptop, median of 3 runs. pngmint as installed, default compressor.</text>
<text x="28" y="78" font-weight="500" fill="#f0efec">Photos, 5 images (0.4 to 14 MP)</text>
<text x="28" y="104" fill="#f0efec" font-weight="500">File size</text>
