<text x="434" y="223" fill="#c3c2b7" font-weight="400">libimagequant</text>
<rect x="542" y="211" width="136.0" height="16" rx="3" fill="#75746e"/>
<text x="686.0" y="223" fill="#c3c2b7" font-size="12">2.2 MB</text>
<text x="434" y="256" fill="#3987e5" font-size="12" font-weight="600" letter-spacing="0.06em">CLOSENESS TO THE ORIGINAL</text>
<text x="434" y="271" fill="#c3c2b7" font-size="11">PSNR in dB, mean of the group, higher is better</text>
<line x1="542" x2="542" y1="282" y2="370" stroke="#33332f" stroke-width="1"/>
<text x="542" y="382" text-anchor="middle" fill="#c3c2b7" font-size="11">47 dB</text>
<line x1="678" x2="678" y1="282" y2="370" stroke="#33332f" stroke-width="1"/>
<text x="678" y="382" text-anchor="middle" fill="#c3c2b7" font-size="11">59 dB</text>
<text x="434" y="296" fill="#f0efec" font-weight="500">pngmint</text>
<line x1="542" x2="675.8" y1="292" y2="292" stroke="#33332f" stroke-width="1"/>
<circle cx="675.8" cy="292" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="686.8" y="296" fill="#f0efec" font-size="12">58.81 dB</text>
<text x="434" y="319" fill="#c3c2b7" font-weight="400">UPNG.js</text>
<line x1="542" x2="657.3" y1="315" y2="315" stroke="#33332f" stroke-width="1"/>
<circle cx="657.3" cy="315" r="6" fill="#75746e" stroke="#1a1a19" stroke-width="2"/>
<text x="668.3" y="319" fill="#c3c2b7" font-size="12">57.17 dB</text>
