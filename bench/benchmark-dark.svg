<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13">
<title>Four PNG quantizers at 256 colors: file size, PSNR and time</title>
<rect width="800" height="600" rx="12" fill="#1a1a19"/>
<text x="32" y="28" font-size="16" font-weight="500" fill="#f0efec">Four palette quantizers at 256 colors, same pixels in, same color count</text>
<text x="32" y="46" fill="#c3c2b7">14 public-domain images, Node 26, Apple Silicon laptop, median of 3 runs. pngmint as installed, default compressor.</text>
<text x="32" y="78" font-size="15" font-weight="600" fill="#f0efec">Photos, 5 images<tspan dx="8" font-size="11" font-weight="400" fill="#c3c2b7">0.4 to 14 MP</tspan></text>
<line x1="32" x2="380" y1="88" y2="88" stroke="#33332f" stroke-width="1"/>
<text x="46" y="114" fill="#3987e5" font-size="12" font-weight="600" letter-spacing="0.06em">FILE SIZE</text>
<text x="46" y="129" fill="#c3c2b7" font-size="11">sum of the group, lower is better</text>
<text x="46" y="154" fill="#f0efec" font-weight="500">pngmint</text>
<rect x="154" y="142" width="113.8" height="16" rx="3" fill="#3987e5"/>
<text x="275.8" y="154" fill="#f0efec" font-size="12">9.6 MB</text>
<text x="46" y="177" fill="#c3c2b7" font-weight="400">UPNG.js</text>
<rect x="154" y="165" width="115.7" height="16" rx="3" fill="#75746e"/>
<text x="277.7" y="177" fill="#c3c2b7" font-size="12">9.8 MB</text>
<text x="46" y="200" fill="#c3c2b7" font-weight="400">image-q</text>
<rect x="154" y="188" width="114.9" height="16" rx="3" fill="#75746e"/>
<text x="276.9" y="200" fill="#c3c2b7" font-size="12">9.7 MB</text>
<text x="46" y="223" fill="#c3c2b7" font-weight="400">libimagequant</text>
<rect x="154" y="211" width="136.0" height="16" rx="3" fill="#75746e"/>
<text x="298.0" y="223" fill="#c3c2b7" font-size="12">11.5 MB</text>
<text x="46" y="256" fill="#3987e5" font-size="12" font-weight="600" letter-spacing="0.06em">CLOSENESS TO THE ORIGINAL</text>
<text x="46" y="271" fill="#c3c2b7" font-size="11">PSNR in dB, mean of the group, higher is better</text>
<line x1="154" x2="154" y1="282" y2="370" stroke="#33332f" stroke-width="1"/>
<text x="154" y="382" text-anchor="middle" fill="#c3c2b7" font-size="11">35 dB</text>
<line x1="290" x2="290" y1="282" y2="370" stroke="#33332f" stroke-width="1"/>
<text x="290" y="382" text-anchor="middle" fill="#c3c2b7" font-size="11">38 dB</text>
<text x="46" y="296" fill="#f0efec" font-weight="500">pngmint</text>
<line x1="154" x2="280.0" y1="292" y2="292" stroke="#33332f" stroke-width="1"/>
<circle cx="280.0" cy="292" r="6" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
<text x="291.0" y="296" fill="#f0efec" font-size="12">37.78 dB</text>
<text x="46" y="319" fill="#c3c2b7" font-weight="400">UPNG.js</text>
<line x1="154" x2="246.5" y1="315" y2="315" stroke="#33332f" stroke-width="1"/>
<circle cx="246.5" cy="315" r="6" fill="#75746e" stroke="#1a1a19" stroke-width="2"/>
<text x="257.5" y="319" fill="#c3c2b7" font-size="12">37.04 dB</text>
<text x="46" y="342" fill="#c3c2b7" font-weight="400">image-q</text>
<line x1="154" x2="228.8" y1="338" y2="338" stroke="#33332f" stroke-width="1"/>
<circle cx="228.8" cy="338" r="6" fill="#75746e" stroke="#1a1a19" stroke-width="2"/>
<text x="239.8" y="342" fill="#c3c2b7" font-size="12">36.65 dB</text>
<text x="46" y="365" fill="#c3c2b7" font-weight="400">libimagequant</text>
<line x1="154" x2="214.7" y1="361" y2="361" stroke="#33332f" stroke-width="1"/>
<circle cx="214.7" cy="361" r="6" fill="#75746e" stroke="#1a1a19" stroke-width="2"/>
<text x="225.7" y="365" fill="#c3c2b7" font-size="12">36.34 dB</text>
<text x="46" y="410" fill="#3987e5" font-size="12" font-weight="600" letter-spacing="0.06em">TIME</text>
<text x="46" y="425" fill="#c3c2b7" font-size="11">sum of the group, lower is better</text>
<text x="46" y="450" fill="#f0efec" font-weight="500">pngmint</text>
<rect x="154" y="438" width="12.0" height="16" rx="3" fill="#3987e5"/>
<text x="174.0" y="450" fill="#f0efec" font-size="12">3623 ms</text>
<text x="46" y="473" fill="#c3c2b7" font-weight="400">UPNG.js</text>
<rect x="154" y="461" width="14.6" height="16" rx="3" fill="#75746e"/>
<text x="176.6" y="473" fill="#c3c2b7" font-size="12">4429 ms</text>
<text x="46" y="496" fill="#c3c2b7" font-weight="400">image-q</text>
<rect x="154" y="484" width="136.0" height="16" rx="3" fill="#75746e"/>
<text x="298.0" y="496" fill="#c3c2b7" font-size="12">41.1 s</text>
<text x="46" y="519" fill="#c3c2b7" font-weight="400">libimagequant</text>
<rect x="154" y="507" width="26.2" height="16" rx="3" fill="#75746e"/>
<text x="188.2" y="519" fill="#c3c2b7" font-size="12">7927 ms</text>
<text x="420" y="78" font-size="15" font-weight="600" fill="#f0efec">Graphics, 9 images<tspan dx="8" font-size="11" font-weight="400" fill="#c3c2b7">screenshots, illustrations, logos</tspan></text>
<line x1="420" x2="768" y1="88" y2="88" stroke="#33332f" stroke-width="1"/>
<text x="434" y="114" fill="#3987e5" font-size="12" font-weight="600" letter-spacing="0.06em">FILE SIZE</text>
<text x="434" y="129" fill="#c3c2b7" font-size="11">sum of the group, lower is better</text>
<text x="434" y="154" fill="#f0efec" font-weight="500">pngmint</text>
